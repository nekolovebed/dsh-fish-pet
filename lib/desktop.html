<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>dsh-neko-pet</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #stage {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end; gap: 4px; padding: 6px 8px 10px;
  }
  /* One plain rounded frame above the head. */
  #bubble {
    max-width: 250px; background: rgba(255, 255, 255, 0.97); color: #1b2130;
    border-radius: 13px; padding: 8px 11px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
    font-size: 12.5px; line-height: 1.45; white-space: pre-wrap; word-break: break-word;
    position: relative; opacity: 0; transform: translateY(6px);
    transition: opacity .18s ease, transform .18s ease;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    pointer-events: none; -webkit-app-region: no-drag;
  }
  #bubble.show { opacity: 1; transform: translateY(0); }
  #bubble::after {
    content: ""; position: absolute; left: 50%; margin-left: -6px; bottom: -5px;
    width: 11px; height: 11px; background: rgba(255, 255, 255, 0.97);
    transform: rotate(45deg); border-radius: 2px;
  }
  #pet-wrap {
    position: relative; display: flex; align-items: flex-end; justify-content: center;
    width: 210px; -webkit-app-region: drag; cursor: grab;
  }
  #pet-wrap::after {
    content: ""; position: absolute; left: 18%; right: 18%; bottom: 2px; height: 9px;
    background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.32), rgba(0, 0, 0, 0) 70%);
    z-index: -1;
  }
  #pet-stack {
    position: relative; width: 100%; display: block;
    filter: drop-shadow(0 10px 16px rgba(0, 0, 0, 0.32));
    animation: float 4.6s ease-in-out infinite;
  }
  #pet-stack.clip { animation: none !important; }
  .rig-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .rig-prop { position: absolute; pointer-events: none; }
  .rig-prop img { display: block; width: 100%; height: auto; pointer-events: none; }
  #pet-stack.act-jump { animation: hop 1.1s ease-out; }
  #pet-stack.act-spin { animation: spin 1.2s linear; }
  #pet-stack.act-dance { animation: dance .6s ease-in-out 4; }
  #pet-stack.act-shy { animation: shy 1s ease-in-out 2; }
  #close {
    position: absolute; right: 7px; top: 6px; width: 22px; height: 22px; border-radius: 50%;
    border: none; background: rgba(0, 0, 0, 0.38); color: #fff; font-size: 13px;
    line-height: 22px; text-align: center; cursor: pointer; opacity: 0; transition: opacity .15s;
    -webkit-app-region: no-drag; padding: 0;
  }
  body:hover #close { opacity: 1; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 30% { transform: translateY(-14px); } 62% { transform: translateY(0); } }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  @keyframes dance { 0%, 100% { transform: translateX(-6px) rotate(-5deg); } 50% { transform: translateX(6px) rotate(5deg); } }
  @keyframes shy { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-5deg) translateY(2px); } }
</style>
</head>
<body>
  <div id="stage">
    <div id="bubble"></div>
    <div id="pet-wrap"><div id="pet-stack"></div></div>
  </div>
  <button id="close" title="关闭悬浮窗">×</button>
  <script src="/plugins/dsh-neko-pet/desktop.js__DSH_TOKEN_QUERY__"></script>
</body>
</html>
